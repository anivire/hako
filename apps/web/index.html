<!doctype html>
<html lang="ru" data-theme="hako" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#15100a" />
    <title>hako</title>
    <meta name="description" content="A self-hosted game server panel for you and the people you invite" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hako" />
    <meta property="og:title" content="hako" />
    <meta property="og:description" content="A self-hosted game server panel for you and the people you invite" />
    <meta property="og:image" content="__APP_URL__/og.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('hako:appearance') || '{}')
        var d = document.documentElement
        if (a.theme) d.dataset.theme = a.theme
        var s = a.scheme || 'dark'
        d.classList.toggle('dark', s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
